<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le baptême de Léonie - 6 juin 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Cloudinary Upload Widget -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
</head>
<body>
    <!-- SVG Filters pour texture papier -->
    <svg style="display: none;">
        <defs>
            <filter id="paper-texture">
                <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" seed="2" />
                <feColorMatrix type="saturate" values="0" />
                <feComponentTransfer>
                    <feFuncA type="discrete" tableValues="0 0 0 0.05" />
                </feComponentTransfer>
            </filter>
        </defs>
    </svg>

    <!-- Animation d'enveloppe 3D photoréaliste -->
    <div id="envelope-scene" class="envelope-scene">
        <p class="instruction-text">Cliquez sur l'enveloppe</p>
        
        <div class="envelope-container" id="envelope-container">
            <!-- Enveloppe principale -->
            <div class="envelope" id="envelope">
                <!-- Corps de l'enveloppe -->
                <div class="envelope-body">
                    <div class="paper-texture-overlay"></div>
                </div>
                
                <!-- Rabat triangulaire -->
                <div class="envelope-flap" id="envelope-flap">
                    <div class="flap-fold"></div>
                    <!-- Cachet de cire -->
                    <div class="wax-seal">
                        <div class="wax-shine"></div>
                        <span class="wax-monogram">L</span>
                    </div>
                </div>
            </div>
            
            <!-- Faire-part qui sort de l'enveloppe -->
            <div class="invitation-card" id="invitation-card">
                <div class="card-content">
                    <!-- Option 1 : Image personnalisée -->
                    <img src="faire-part-leonie.jpg" alt="Faire-part de Léonie" class="invitation-image" id="invitation-image" style="display: none;">
                    
                    <!-- Option 2 : Contenu par défaut élégant -->
                    <div class="invitation-default" id="invitation-default">
                        <p class="invitation-eyebrow">Le baptême de</p>
                        <h1 class="invitation-name">LÉONIE</h1>
                        <div class="invitation-ornament"></div>
                        <p class="invitation-date">Vendredi 6 juin 2026</p>
                        <p class="invitation-location">Salle polyvalente de Meillon</p>
                        <p class="invitation-postcode">64510 Pyrénées-Atlantiques</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Bouton pour rejouer l'animation (apparaît après ouverture) -->
        <button id="reset-btn" class="reset-button" style="display: none;">
            Fermer et rejouer
        </button>
    </div>

    <!-- Contenu principal du site (apparaît après l'animation) -->
    <div id="main-content" class="main-content hidden">
        <!-- Navigation sticky -->
        <nav class="main-nav">
            <div class="nav-container">
                <a href="#accueil" class="nav-link active">Accueil</a>
                <a href="#photos" class="nav-link">Photos</a>
                <a href="#livre-or" class="nav-link">Livre d'or</a>
                <a href="#quiz" class="nav-link">Quiz</a>
                <a href="#infos" class="nav-link">Infos</a>
            </div>
        </nav>

        <!-- Section Accueil -->
        <section id="accueil" class="hero-section">
            <div class="hero-content">
                <div class="hero-text reveal">
                    <p class="hero-subtitle">Célébration du baptême de</p>
                    <h1 class="hero-title">LÉONIE</h1>
                    <div class="event-details">
                        <p class="event-date">📅 Vendredi 6 juin 2026</p>
                        <p class="event-location">📍 Salle polyvalente de Meillon</p>
                    </div>
                    <div class="countdown-container">
                        <div id="countdown" class="countdown"></div>
                    </div>
                </div>
                <div class="hero-image reveal">
                    <div class="image-placeholder">
                        <svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="100" cy="100" r="80" fill="#C3A2A5" opacity="0.3"/>
                            <circle cx="100" cy="80" r="40" fill="#C3A2A5"/>
                            <ellipse cx="80" cy="130" rx="30" ry="50" fill="#C3A2A5"/>
                            <ellipse cx="120" cy="130" rx="30" ry="50" fill="#C3A2A5"/>
                            <circle cx="90" cy="75" r="5" fill="#7C6755"/>
                            <circle cx="110" cy="75" r="5" fill="#7C6755"/>
                            <path d="M 85 90 Q 100 100 115 90" stroke="#7C6755" stroke-width="3" fill="none"/>
                        </svg>
                    </div>
                </div>
            </div>
            <div class="scroll-indicator">
                <span>↓</span>
            </div>
        </section>

        <!-- Sections suivantes (identiques au site précédent) -->
        <!-- ... (garder toutes les autres sections) ... -->
        
    </div>

    <script src="script-3d.js"></script>
</body>
</html>
